name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar commit novo no meio, a anterior é abandonada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Testar e montar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes
        run: npm test

      - name: Construir a partir do código-fonte
        # O site publicado é SEMPRE construído aqui, nunca o arquivo commitado.
        # Assim é impossível ir ao ar código defasado, por construção.
        run: |
          git show HEAD:index.html > /tmp/commitado.html
          npm run build

      - name: O build commitado bate com o código-fonte?
        # Guard para quem baixa o index.html do repositório em vez de usar o
        # site. Compara só <style> e <script>, que é o que vem de src/ — o
        # ícone é PNG comprimido com zlib, e a saída do zlib varia com a versão
        # da biblioteca, então byte a byte acusaria diferença sem nada errado.
        run: node scripts/conferir-build.mjs /tmp/commitado.html index.html

      - name: Montar o site
        # Só o que o navegador precisa. O código-fonte fica no repositório, não
        # servido como página.
        run: |
          mkdir -p _site
          cp index.html sandbox.html _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
